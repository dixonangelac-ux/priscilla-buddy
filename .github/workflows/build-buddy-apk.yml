name: Build Buddy Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-buddy/**'
      - '.github/workflows/build-buddy-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble debug APK
        working-directory: android-buddy
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: priscilla-buddy-debug-apk
          path: android-buddy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
