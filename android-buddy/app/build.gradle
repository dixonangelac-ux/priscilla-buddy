plugins { id 'com.android.application' }
android {
    namespace 'com.priscillabuddy.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.priscillabuddy.app'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '2.0-dev'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
